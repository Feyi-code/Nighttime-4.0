<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlumberSpace — Your Calming Nighttime Companion</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-theme="moonlight" data-accent="amber">

    <!-- Ambient background glow elements -->
    <div class="ambient-glow glow-top" aria-hidden="true"></div>
    <div class="ambient-glow glow-bottom" aria-hidden="true"></div>

    <!-- MAIN CONTAINER STARTS -->
    <main class="app-container">

        <!-- 1. ONBOARDING QUESTIONNAIRE VIEW -->
        <section id="questionnaire-view" class="view active" aria-labelledby="quiz-heading">
            <header class="header">
                <div class="moon-badge">🌙 SlumberSpace</div>
                <h1 id="quiz-heading">Let's Make Tonight a Little Easier</h1>
                <p class="subtitle">Answer a few questions so we can build a realistic, gentle nighttime routine for your college life.</p>
                
                <div class="progress-wrapper">
                    <div class="progress-bar-container" role="progressbar" id="progress-bar-elem" aria-valuemin="1" aria-valuemax="24" aria-valuenow="1">
                        <div class="progress-bar-fill" id="progress-bar-fill"></div>
                    </div>
                    <span class="progress-text" id="progress-text">Question 1 of 24</span>
                </div>
            </header>

            <div class="card quiz-card">
                 <!-- Single-Question Container Dynamic Injection -->

                <div id="question-card-container" class="question-container" aria-live="polite">

                    <!-- Dynamic question content injected by app.js -->

                </div>

                <div class="quiz-nav-actions">
                    <button type="button" id="prev-q-btn" class="btn btn-secondary" disabled>&larr; Previous</button>
                    <button type="button" id="next-q-btn" class="btn btn-primary">Next Question &rarr;</button>
                </div>
            </div>
        </section>

        <!-- 2. TRANSITION VIEW -->
        <section id="transition-view" class="view" aria-live="polite">
            <div class="loading-content">
                <div class="breathing-orb" aria-hidden="true"></div>
                <h2 id="transition-heading">Let's find a rhythm that fits your life.</h2>
                <p id="transition-status" class="loading-subtitle">Looking at your sleep patterns…</p>
                <div class="loading-dots" aria-hidden="true">
                    <span>.</span><span>.</span><span>.</span>
                </div>
            </div>
        </section>

        <!-- 3. SCHEDULE DASHBOARD VIEW -->
        <section id="schedule-view" class="view" aria-labelledby="schedule-heading">
            ...
        </section>

        <!-- 4. WIND-DOWN TIMER VIEW -->
        <section id="winddown-view" class="view" aria-labelledby="winddown-heading">
            ...
        </section>

    </main>
    <!-- MAIN CONTAINER ENDS HERE -->

    <!-- Overlays stay OUTSIDE main -->
    <div id="lockdown-overlay" class="lockdown-overlay" role="dialog" aria-modal="true" aria-labelledby="sleep-mode-title">
        ...
    </div>

    <div id="alarm-overlay" class="alarm-overlay" role="dialog" aria-modal="true" aria-labelledby="alarm-title">
        ...
    </div>

    <script src="app.js"></script>
</body>
</html>
